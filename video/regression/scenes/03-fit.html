<section class="scene" id="scene-fit">
	<!-- The chart. Pixel x = 110 + (temperature - 10) * 45.4545, pixel y = 650 - icecreams * 6.
	     Line, segments, squares and numbers are placed by 03-fit.js from the line's slope and
	     intercept; the values below are the first guess, sold = 2 x temperature + 10. -->
	<svg class="fit__chart" id="fit-chart" viewBox="0 0 1150 780" width="1150" height="780">
		<g id="fit-axes">
			<line class="fit__grid" x1="110" y1="530" x2="1110" y2="530" />
			<line class="fit__grid" x1="110" y1="410" x2="1110" y2="410" />
			<line class="fit__grid" x1="110" y1="290" x2="1110" y2="290" />
			<line class="fit__grid" x1="110" y1="170" x2="1110" y2="170" />
			<line class="fit__grid" x1="110" y1="50" x2="1110" y2="50" />
			<line class="fit__grid" x1="337.3" y1="50" x2="337.3" y2="650" />
			<line class="fit__grid" x1="564.5" y1="50" x2="564.5" y2="650" />
			<line class="fit__grid" x1="791.8" y1="50" x2="791.8" y2="650" />
			<line class="fit__grid" x1="1019.1" y1="50" x2="1019.1" y2="650" />
			<line class="fit__axis" x1="110" y1="650" x2="1110" y2="650" />
			<line class="fit__axis" x1="110" y1="650" x2="110" y2="50" />
			<text class="fit__tick" x="94" y="658" text-anchor="end">0</text>
			<text class="fit__tick" x="94" y="538" text-anchor="end">20</text>
			<text class="fit__tick" x="94" y="418" text-anchor="end">40</text>
			<text class="fit__tick" x="94" y="298" text-anchor="end">60</text>
			<text class="fit__tick" x="94" y="178" text-anchor="end">80</text>
			<text class="fit__tick" x="94" y="58" text-anchor="end">100</text>
			<text class="fit__tick" x="110" y="686" text-anchor="middle">10</text>
			<text class="fit__tick" x="337.3" y="686" text-anchor="middle">15</text>
			<text class="fit__tick" x="564.5" y="686" text-anchor="middle">20</text>
			<text class="fit__tick" x="791.8" y="686" text-anchor="middle">25</text>
			<text class="fit__tick" x="1019.1" y="686" text-anchor="middle">30</text>
			<text class="fit__axtitle" x="610" y="740" text-anchor="middle">Temperature (&deg;C)</text>
			<text class="fit__axtitle" transform="translate(32 350) rotate(-90)" text-anchor="middle">Ice creams sold</text>
		</g>

		<!-- squares: the side of each one is that dot's error -->
		<g id="fit-squares">
			<rect id="fit-sq-0" class="fit__sq" x="116.9" y="446" width="84" height="84" />
			<rect id="fit-sq-1" class="fit__sq" x="301.3" y="410" width="36" height="36" />
			<rect id="fit-sq-2" class="fit__sq" x="443.6" y="374" width="30" height="30" />
			<rect id="fit-sq-3" class="fit__sq" x="574" y="302" width="36" height="36" />
			<rect id="fit-sq-4" class="fit__sq" x="716.4" y="272" width="30" height="30" />
			<rect id="fit-sq-5" class="fit__sq" x="786.7" y="170" width="96" height="96" />
			<rect id="fit-sq-6" class="fit__sq" x="911.1" y="122" width="108" height="108" />
		</g>
		<g id="fit-sqlabels">
			<text id="fit-sqlab-0" class="fit__sqlab" x="158.9" y="497" text-anchor="middle">196</text>
			<text id="fit-sqlab-5" class="fit__sqlab" x="834.7" y="227" text-anchor="middle">256</text>
			<text id="fit-sqlab-6" class="fit__sqlab" x="965.1" y="185" text-anchor="middle">324</text>
		</g>

		<!-- the line we started with, kept as a faint ghost while the real line moves -->
		<line id="fit-ghost" opacity="0" x1="110" y1="470" x2="1110" y2="206" stroke="#9daad0" stroke-width="5" stroke-dasharray="14 12" />
		<text id="fit-lab-ghost" opacity="0" class="fit__small" x="125" y="410">first guess</text>

		<!-- errors: from each dot straight up or down to the line -->
		<g id="fit-segs">
			<line id="fit-seg-0" class="fit__seg" x1="200.9" y1="530" x2="200.9" y2="446" />
			<line id="fit-seg-1" class="fit__seg" x1="337.3" y1="446" x2="337.3" y2="410" />
			<line id="fit-seg-2" class="fit__seg" x1="473.6" y1="404" x2="473.6" y2="374" />
			<line id="fit-seg-3" class="fit__seg" x1="610" y1="302" x2="610" y2="338" />
			<line id="fit-seg-4" class="fit__seg" x1="746.4" y1="272" x2="746.4" y2="302" />
			<line id="fit-seg-5" class="fit__seg" x1="882.7" y1="170" x2="882.7" y2="266" />
			<line id="fit-seg-6" class="fit__seg" x1="1019.1" y1="122" x2="1019.1" y2="230" />
		</g>

		<line id="fit-line" x1="110" y1="470" x2="1110" y2="206" stroke="#eef1fb" stroke-width="7" stroke-linecap="round" />

		<g id="fit-dots">
			<circle class="fit__dot" cx="200.9" cy="530" r="11" />
			<circle class="fit__dot" cx="337.3" cy="446" r="11" />
			<circle class="fit__dot" cx="473.6" cy="404" r="11" />
			<circle class="fit__dot" cx="610" cy="302" r="11" />
			<circle class="fit__dot" cx="746.4" cy="272" r="11" />
			<circle class="fit__dot" cx="882.7" cy="170" r="11" />
			<circle class="fit__dot" cx="1019.1" cy="122" r="11" />
		</g>
		<circle id="fit-ring" cx="1019.1" cy="122" r="24" fill="none" stroke="#eef1fb" stroke-width="4" />

		<g id="fit-errlabels">
			<text id="fit-err-0" class="fit__errlab" x="217" y="497">14</text>
			<text id="fit-err-1" class="fit__errlab" x="353" y="437">6</text>
			<text id="fit-err-2" class="fit__errlab" x="490" y="397">5</text>
			<text id="fit-err-3" class="fit__errlab" x="626" y="329">6</text>
			<text id="fit-err-4" class="fit__errlab" x="762" y="295">5</text>
			<text id="fit-err-5" class="fit__errlab" x="899" y="227">16</text>
			<text id="fit-err-6" class="fit__errlab" x="1035" y="185">18</text>
		</g>

		<text id="fit-lab-bad" class="fit__eq" x="130" y="96">candidate line: <tspan class="fit__eqb">sold = 2 &times; temperature + 10</tspan></text>
		<text id="fit-lab-best" class="fit__eq fit__eq--best" x="130" y="96">best line: <tspan class="fit__eqb">sold = 3.79 &times; temperature &minus; 24.6</tspan></text>
		<text id="fit-lab-fast" class="fit__small" x="130" y="140">found by a computer in an instant</text>

		<g id="fit-legend">
			<rect x="132" y="118" width="8" height="40" rx="3" fill="#f87171" />
			<text class="fit__legend" x="156" y="148">error = the gap between a dot and the line</text>
		</g>

		<g id="fit-callout">
			<g id="fit-co-big">
				<rect x="682" y="410" width="54" height="54" fill="rgba(248,113,113,0.3)" stroke="#f87171" stroke-width="3" />
				<text class="fit__co" x="756" y="446">miss 18 &rarr; square <tspan class="fit__cob">324</tspan></text>
			</g>
			<g id="fit-co-small">
				<rect x="700" y="486" width="18" height="18" fill="rgba(248,113,113,0.3)" stroke="#f87171" stroke-width="3" />
				<text class="fit__co" x="756" y="504">miss 6 &rarr; square <tspan class="fit__cob">36</tspan></text>
			</g>
			<text id="fit-co-ratio" class="fit__co fit__co--ratio" x="682" y="564">3&times; the miss = 9&times; the square</text>
		</g>
	</svg>

	<!-- beat 1: one dot, worked out -->
	<div class="card fit__panel fit__ex" id="fit-ex">
		<div class="card__label" id="fit-ex-title">One dot, up close</div>
		<div class="fit__exrow" id="fit-ex-0"><span>Temperature</span><b>30 &deg;C</b></div>
		<div class="fit__exrow" id="fit-ex-1"><span>Real ice creams (the dot)</span><b class="amber">88</b></div>
		<div class="fit__exrow" id="fit-ex-2"><span>What the line says</span><b>70</b></div>
		<div class="fit__exrow fit__exrow--err" id="fit-ex-3"><span>Error: the gap</span><b class="red">88 &minus; 70 = 18</b></div>
	</div>

	<!-- beats 2 and 3: every error, squared, and the total -->
	<div class="card fit__panel fit__tab" id="fit-tab">
		<div class="fit__thead"><span>Dot</span><span>Error</span><span>Error &times; error</span></div>
		<div class="fit__trow" id="fit-trow-0"><span class="fit__tt"><i></i>12 &deg;C</span><span class="fit__te" id="fit-e-0">14</span><span class="fit__ts" id="fit-s-0">196</span></div>
		<div class="fit__trow" id="fit-trow-1"><span class="fit__tt"><i></i>15 &deg;C</span><span class="fit__te" id="fit-e-1">6</span><span class="fit__ts" id="fit-s-1">36</span></div>
		<div class="fit__trow" id="fit-trow-2"><span class="fit__tt"><i></i>18 &deg;C</span><span class="fit__te" id="fit-e-2">5</span><span class="fit__ts" id="fit-s-2">25</span></div>
		<div class="fit__trow" id="fit-trow-3"><span class="fit__tt"><i></i>21 &deg;C</span><span class="fit__te" id="fit-e-3">6</span><span class="fit__ts" id="fit-s-3">36</span></div>
		<div class="fit__trow" id="fit-trow-4"><span class="fit__tt"><i></i>24 &deg;C</span><span class="fit__te" id="fit-e-4">5</span><span class="fit__ts" id="fit-s-4">25</span></div>
		<div class="fit__trow" id="fit-trow-5"><span class="fit__tt"><i></i>27 &deg;C</span><span class="fit__te" id="fit-e-5">16</span><span class="fit__ts" id="fit-s-5">256</span></div>
		<div class="fit__trow" id="fit-trow-6"><span class="fit__tt"><i></i>30 &deg;C</span><span class="fit__te" id="fit-e-6">18</span><span class="fit__ts" id="fit-s-6">324</span></div>
		<div class="fit__tsum">
			<div class="fit__tlabel">Total of squared errors</div>
			<div class="fit__tnum" id="fit-total">898</div>
		</div>
		<div class="fit__verdict" id="fit-verdict">Least squares: smallest total wins</div>
	</div>
</section>
